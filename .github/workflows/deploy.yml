name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash -n scripts/deploy.sh scripts/release.sh
      - run: npm run check
      - run: npm run build
      - name: Configure deployment SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST}" "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_KEY:?Missing SSH_KEY}" "${SSH_KNOWN_HOSTS:?Missing SSH_KNOWN_HOSTS}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || exit 1
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]] || exit 1
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/profile-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/profile-deploy ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deployment-target
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/profile-deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config
      - name: Deploy release
        env:
          SSH_HOST: deployment-target
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: bash scripts/deploy.sh
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/profile-deploy ~/.ssh/config ~/.ssh/known_hosts
