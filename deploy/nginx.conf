# Profile site at the root domain. Install it in the same change that removes
# konakona.dev from the blog's server_name. See DEPLOY.md.
server {
    listen 80;
    listen [::]:80;
    server_name konakona.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name konakona.dev;
    # Shared lineage that already covers konakona.dev and the other subdomains.
    ssl_certificate /etc/letsencrypt/live/konakona-dev-dual/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/konakona-dev-dual/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/konakona.dev/current;
    index index.html;
    error_page 404 /404.html;

    # Locations that set their own add_header inherit none of these, so the
    # snippet is included again inside each of them.
    include snippets/konakona-profile-headers.conf;

    # konakona.dev used to serve the blog. Keep its old URLs working.
    # /zh/ itself now belongs to the profile; only /zh/posts/ moves.
    location ~ ^/(en|posts|folders|og|images|lab|scripts|zh/posts)(/|$) {
        return 301 https://blog.konakona.dev$request_uri;
    }
    location = /rss.xml {
        return 301 https://blog.konakona.dev/rss.xml;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        add_header Cache-Control "no-store" always;
    }
    location = /.well-known/deployment.txt {
        add_header Cache-Control "no-store" always;
        include snippets/konakona-profile-headers.conf;
        try_files $uri =404;
    }
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/konakona-profile-headers.conf;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        include snippets/konakona-profile-headers.conf;
        try_files $uri $uri/ =404;
    }
}
