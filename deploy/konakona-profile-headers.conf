# Install as /etc/nginx/snippets/konakona-profile-headers.conf.
# script-src and connect-src allow Cloudflare Web Analytics, which the edge
# injects. Everything else is self-hosted; the page has no inline scripts or styles.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
